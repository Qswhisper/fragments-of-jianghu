<!DOCTYPE html>
<html lang="zh-CN" data-theme="woodcut">
<head>
  <meta charset="UTF-8"><base href="../../"><script>window.KGAME_STORAGE_NAMESPACE="kgame-realistic-review";</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>江湖残卷 · 写实战斗样段</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0f0f0f;
      overflow: hidden;
      font-family: "KGame Song", "KGame Sans", serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #game-canvas {
      display: block;
      width: 1280px;
      height: 720px;
      background: #121212;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
      image-rendering: auto;
    }
  body { flex-direction:column; } #game-shell { min-height:0; flex:1; } #review-controls {box-sizing:border-box;width:100%;padding:8px 18px;background:#171713;color:#b9ad95;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;} select,button {background:#28251e;color:#dfd1b7;border:1px solid #514736;padding:5px 10px;font:inherit;} #review-controls small {margin-left:auto;}
  #sound-panel {position:absolute;z-index:10;top:52px;right:18px;width:286px;box-sizing:border-box;padding:18px;background:#191713;border:1px solid #625039;color:#d5c7ae;font-size:14px;box-shadow:0 8px 24px #0009;}
  #sound-panel[hidden] {display:none;} #sound-panel header {display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  #sound-panel label {display:grid;grid-template-columns:34px 1fr 38px;align-items:center;gap:12px;margin:18px 0;}
  #sound-panel input {width:100%;accent-color:#bda27c;} #sound-panel output {text-align:right;font-size:12px;}
  #sound-panel small {color:#aa997d;font-size:12px;} #sound-panel .palette-label {display:block;} #sound-palette {width:100%;margin-top:8px;} .audition-cues {display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;} .audition-cues button {font-size:12px;padding:5px 8px;} #sound-panel a {color:#c6b190;} </style>
  <script src="assets/fonts/bundled-fonts.js"></script>
</head>
<body>
  <div id="review-controls"><label>样段 <select id="review-stage"><option value="combat">战斗</option><option value="reward">战后奖励</option><option value="rest">破庙休息</option><option value="sequence">连续行路</option></select></label><label>遭遇 <select id="encounter"><option value="street">单敌：乱军缺口</option><option value="scout">斥候：刺刀与点射</option><option value="instructor">教官：瞄准与穿透</option><option value="pair">双敌：缉捕巡街</option><option value="triple">三敌：布局验证</option></select></label><label>流派 <select id="style"><option value="blade">吹命刀</option><option value="iron">铁骨衣</option><option value="dirty">下九流</option><option value="combo">江湖把子</option></select></label><label>战斗画面 <select id="look"><option value="realistic">写实样段</option><option value="woodcut">版画对照</option></select></label><label>演出 <select id="pace"><option value="1">正常</option><option value="2">快节奏</option></select></label><label><input id="reduced-motion" type="checkbox">减弱晃动</label><button id="retry">开始 / 重试</button><button id="sound-toggle" aria-controls="sound-panel" aria-expanded="false">声音</button><small>独立样段</small></div>
  <section id="sound-panel" role="dialog" aria-label="战斗声音" hidden>
    <header><strong>战斗声音</strong><button id="sound-close" aria-label="关闭声音设置">关闭</button></header>
    <label>音乐<input id="music-volume" type="range" min="0" max="100" value="100" aria-label="音乐音量"><output id="music-level" for="music-volume">100%</output></label>
    <label>音效<input id="sfx-volume" type="range" min="0" max="100" value="100" aria-label="音效音量"><output id="sfx-level" for="sfx-volume">100%</output></label>
    <small>拖动调节，0% 静音。</small>
    <label class="palette-label">战斗音效<select id="sound-palette"><option value="original">现有版本</option><option value="candidate">实录候选 · 试听</option></select></label>
    <div class="audition-cues" aria-label="单项音效试听"><button data-audio-cue="swing">挥刀</button><button data-audio-cue="contact">命中</button><button data-audio-cue="parry">格挡</button><button data-audio-cue="prep">枪械准备</button><button data-audio-cue="shot">开火</button></div>
    <small id="sound-audition-note" aria-live="polite">候选可在战斗中比较，听感待评审。</small><br><small><a href="art/realistic-combat/audio-credits.html" target="_blank" rel="noopener">素材来源与许可</a></small>
  </section><div id="game-shell">
    <canvas id="game-canvas" width="1280" height="720" aria-label="江湖残卷游戏画布"></canvas>
  </div>

  <script src="systems/run-report.js"></script>

  <script src="systems/music-player.js"></script>
  <script src="systems/audio.js"></script>

  <script src="render/assets.js"></script>
  <script src="render/canvas-utils.js"></script>
  <script src="render/ui-components.js"></script>
  <script src="render/animations-easing.js"></script>
  <script src="render/animations-state.js"></script>
  <script src="render/animations-ui.js"></script>
  <script src="render/animations.js"></script>
  <script src="render/ui-interactive.js"></script>
  <script src="render/combat-interaction.js"></script>
  <script src="render/woodcut-ui.js"></script>

  <script src="scenes/combat.js"></script>
  <script src="scenes/map.js"></script>
  <script src="scenes/shop.js"></script>
  <script src="scenes/rest-shared.js"></script>

<script src="art/realistic-combat/audio-candidates.js"></script><script src="art/realistic-combat/review.js"></script></body>
</html>
